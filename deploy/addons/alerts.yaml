# Alerts for the Prometheus Operator.
#
# Models: in heart attacks, chest pain is the most common symptom for both
# sexes, but women more often have accompanying symptoms (shortness of
# breath, fatigue, nausea, indigestion) that get missed (Mehta et al. 2016,
# AHA). So Kyvernetria
# keeps the classic "chest pain" alert (CPU saturation) and adds the
# accompanying symptoms of a control plane in trouble: latency creeping up,
# DNS jitter, slow storage.
#
# The Prometheus Operator only loads rules its Prometheus selects. With
# kube-prometheus-stack that is `release: <helm release name>` by default:
# set the label below to your release name, or install the chart with
# prometheus.prometheusSpec.ruleSelectorNilUsesHelmValues=false.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kyvernetria-symptoms
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: kyvernetria.classic
      rules:
        - alert: NodeCPUSaturated
          expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.instance }} has been above 90% CPU for 10 minutes."
    - name: kyvernetria.accompanying-symptoms
      rules:
        - alert: APIServerLatencyCreeping
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(apiserver_request_duration_seconds_bucket{verb!~"WATCH|CONNECT"}[5m])))
              > 2 * histogram_quantile(0.99, sum by (le) (rate(apiserver_request_duration_seconds_bucket{verb!~"WATCH|CONNECT"}[5m] offset 1d)))
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "API p99 latency is twice what it was this time yesterday, even if CPU looks fine."
        - alert: DNSJitter
          # A 5m rate so single slow queries do not dominate, and only while
          # there is traffic: on an idle cluster the quantile is NaN.
          expr: |
            stddev_over_time(
              (
                histogram_quantile(0.99, sum by (le) (rate(coredns_dns_request_duration_seconds_bucket[5m])))
                  and on () sum(rate(coredns_dns_request_duration_seconds_count[5m])) > 0
              )[15m:1m]
            ) > 0.05
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "DNS p99 latency is jumping around by more than 50ms. Workloads feel this before CPU alerts fire."
        - alert: StorageSlowForAPIServer
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(etcd_request_duration_seconds_bucket[5m]))) > 0.5
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "etcd requests from the apiserver take over 500ms at p99. Everything will feel slow soon."

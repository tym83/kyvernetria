# A Kyvernetria cluster in kind: three control-plane nodes, each silencing
# one of the two kube-apiserver alleles at first boot, plus one worker.
#
#   hack/build.sh all
#   kind create cluster --config deploy/kind/mosaic.yaml --image kyvernetria/node:v1.37.0-kyvernetria.0
#   _output/darwin-arm64/kyvctl mosaic
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kyvernetria
nodes:
  - role: control-plane
  - role: control-plane
  - role: control-plane
  - role: worker
kubeadmConfigPatches:
  # x-inactivation keeps the node's kube-apiserver allele in
  # /var/lib/kyvernetria. The controller manager and scheduler always run Xp
  # and need no state. peer-ca-file turns on the mixed-version peer proxy
  # (see deploy/vms/kubeadm.yaml and docs/OPERATIONS.md).
  #
  # The images inside the kind node image keep registry.k8s.io names: kind
  # resolves the images a node needs with kubeadm's default repository.
  # They are Kyvernetria builds all the same (hack/build.sh images).
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        - name: peer-ca-file
          value: /etc/kubernetes/pki/ca.crt
      extraVolumes:
        - name: kyvernetria
          hostPath: /var/lib/kyvernetria
          mountPath: /var/lib/kyvernetria
          pathType: DirectoryOrCreate
    # Demo clusters only: laptops' virtual disks are too slow for four etcd
    # members that fsync every write. Never use this outside a throwaway cluster.
    etcd:
      local:
        extraArgs:
          - name: unsafe-no-fsync
            value: "true"
  # Laptop VMs start four nodes, and unpack two builds of every control-plane
  # component on each, all at once; give kubeadm more patience than default.
  - |
    kind: InitConfiguration
    timeouts:
      controlPlaneComponentHealthCheck: 10m0s
      kubernetesAPICall: 5m0s
      etcdAPICall: 5m0s
  - |
    kind: JoinConfiguration
    timeouts:
      controlPlaneComponentHealthCheck: 10m0s
      kubernetesAPICall: 5m0s
      etcdAPICall: 5m0s
      discovery: 10m0s

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Kyvernetria</title>
  <defs>
    <filter id="clay" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <!-- hand-made wobble -->
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="wob"/>
      <feDisplacementMap in="SourceGraphic" in2="wob" scale="9" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <!-- rounded height map with fingertip dents and fine grain -->
      <feGaussianBlur in="shape" stdDeviation="13" result="soft"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="3" result="dents"/>
      <feTurbulence type="turbulence" baseFrequency="0.9" numOctaves="1" seed="11" result="grain"/>
      <feComposite in="soft" in2="dents" operator="arithmetic" k2="1" k3="0.15" result="h1"/>
      <feComposite in="h1" in2="grain" operator="arithmetic" k2="1" k3="0.015" result="height"/>
      <feDiffuseLighting in="height" surfaceScale="16" diffuseConstant="1.15" lighting-color="#ffffff" result="diff">
        <feDistantLight azimuth="225" elevation="48"/>
      </feDiffuseLighting>
      <feSpecularLighting in="height" surfaceScale="16" specularConstant="0.4" specularExponent="9" lighting-color="#ffd9d2" result="spec">
        <feDistantLight azimuth="225" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="shape" in2="diff" operator="arithmetic" k1="1.1" result="lit"/>
      <feComposite in="spec" in2="shape" operator="in" result="specin"/>
      <feComposite in="lit" in2="specin" operator="arithmetic" k2="1" k3="0.55" result="shiny"/>
      <feComposite in="shiny" in2="shape" operator="in"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="wob"/>
      <feDisplacementMap in="SourceAlpha" in2="wob" scale="9" xChannelSelector="R" yChannelSelector="G" result="a"/>
      <feGaussianBlur in="a" stdDeviation="9"/>
      <feOffset dx="10" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
  </defs>
  <g filter="url(#shadow)"><g  fill="#d4060f" stroke="#d4060f" stroke-linecap="round">
    <g fill="none" stroke-width="42"><circle cx="256" cy="256" r="148"/></g>
    <g stroke-width="34"><line x1="256" y1="256" x2="256.0" y2="56.0"/><line x1="256" y1="256" x2="412.4" y2="131.3"/><line x1="256" y1="256" x2="451.0" y2="300.5"/><line x1="256" y1="256" x2="342.8" y2="436.2"/><line x1="256" y1="256" x2="169.2" y2="436.2"/><line x1="256" y1="256" x2="61.0" y2="300.5"/><line x1="256" y1="256" x2="99.6" y2="131.3"/></g>
    <g stroke="none"><circle cx="256.0" cy="56.0" r="27"/><circle cx="412.4" cy="131.3" r="27"/><circle cx="451.0" cy="300.5" r="27"/><circle cx="342.8" cy="436.2" r="27"/><circle cx="169.2" cy="436.2" r="27"/><circle cx="61.0" cy="300.5" r="27"/><circle cx="99.6" cy="131.3" r="27"/><circle cx="256" cy="256" r="52"/></g>
  </g>
</g>
  <g filter="url(#clay)"><g  fill="#d4060f" stroke="#d4060f" stroke-linecap="round">
    <g fill="none" stroke-width="42"><circle cx="256" cy="256" r="148"/></g>
    <g stroke-width="34"><line x1="256" y1="256" x2="256.0" y2="56.0"/><line x1="256" y1="256" x2="412.4" y2="131.3"/><line x1="256" y1="256" x2="451.0" y2="300.5"/><line x1="256" y1="256" x2="342.8" y2="436.2"/><line x1="256" y1="256" x2="169.2" y2="436.2"/><line x1="256" y1="256" x2="61.0" y2="300.5"/><line x1="256" y1="256" x2="99.6" y2="131.3"/></g>
    <g stroke="none"><circle cx="256.0" cy="56.0" r="27"/><circle cx="412.4" cy="131.3" r="27"/><circle cx="451.0" cy="300.5" r="27"/><circle cx="342.8" cy="436.2" r="27"/><circle cx="169.2" cy="436.2" r="27"/><circle cx="61.0" cy="300.5" r="27"/><circle cx="99.6" cy="131.3" r="27"/><circle cx="256" cy="256" r="52"/></g>
  </g>
</g>
</svg>
